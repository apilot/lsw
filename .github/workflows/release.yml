name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          # keep the v in the asset name — install.sh expects lsw-v<X>-...
          DIST="lsw-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/${DIST}"
          cp target/release/lsw "dist/${DIST}/"
          cp README.md LICENSE "dist/${DIST}/"
          tar -czf "dist/${DIST}.tar.gz" -C dist "${DIST}"
          # basename-style checksum — exactly what install.sh verifies
          (cd dist && sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/lsw-*

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lsw-*.tar.gz
            lsw-*.tar.gz.sha256
          body: |
            Prebuilt binary (x86_64-linux). Runtime requirement: `git` in PATH.

            Install: `curl -fsSL https://raw.githubusercontent.com/apilot/lsw/main/install.sh | sh`

            Or install from crates.io: `cargo install lsw`

  publish:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        # skipped (not failed) until the CARGO_REGISTRY_TOKEN secret is set
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked

      - name: Notice (secret not set)
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipped crates.io publish"
