name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runs-on: ubuntu-latest
          - arch: aarch64-linux
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # native runner: host target == matrix arch, no cross toolchain
        run: cargo build --release --locked

      - name: Package
        run: |
          # keep the v in the asset name — install.sh expects lsw-v<X>-...
          DIST="lsw-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          mkdir -p "dist/${DIST}"
          cp target/release/lsw "dist/${DIST}/"
          cp README.md LICENSE "dist/${DIST}/"
          tar -czf "dist/${DIST}.tar.gz" -C "dist/${DIST}" lsw README.md LICENSE
          # basename-style checksum — exactly what install.sh verifies
          (cd dist && sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/lsw-*

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lsw-*.tar.gz
            lsw-*.tar.gz.sha256
          body: |
            Prebuilt binaries (x86_64-linux, aarch64-linux). Runtime requirement: `git` in PATH.

            Install: `curl -fsSL https://raw.githubusercontent.com/apilot/lsw/main/install.sh | sh`

            Or install from crates.io: `cargo install ls-worktrees` (the command is `lsw`)

  publish:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        # skipped (not failed) until the CARGO_REGISTRY_TOKEN secret is set
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked

      - name: Notice (secret not set)
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipped crates.io publish"
