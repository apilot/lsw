[package]
name = "ls-worktrees"
version = "0.1.10"
edition = "2021"
rust-version = "1.70"
description = "Fast read-only list of git worktrees: branch, dirty state, ahead/behind — at a glance, from any directory inside a repo or across all repos in a folder"
license = "MIT"
readme = "README.md"
repository = "https://github.com/apilot/lsw"
keywords = ["git", "worktree", "cli", "terminal", "productivity"]
categories = ["command-line-utilities", "development-tools"]

# KISS: zero external dependencies — std + system git only.

# Command stays `lsw` regardless of the crates.io package name.
[[bin]]
name = "lsw"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
