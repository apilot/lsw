[package]
name = "lsw"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Fast read-only list of git worktrees: branch, dirty state, ahead/behind — at a glance, across all repos in a folder"
license = "MIT"
repository = "https://github.com/apilot/lsw"
keywords = ["git", "worktree", "cli", "terminal", "productivity"]
categories = ["command-line-utilities", "development-tools"]

# KISS: zero external dependencies — std + system git only.

[profile.release]
lto = true
strip = true
